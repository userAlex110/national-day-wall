name: 构建检查

# 只回答一个问题：这个仓库现在能不能构建。
#
# 为什么这里**不部署** —— 这个仓库不含照片。

# .gitignore 里的 /public/photos/ 把照片派生图挡在库外了，所以 CI 构建出来的
# 是一面**占位墙**。拿它去覆盖你自己那个有照片的站，等于把照片全删了。
# 部署留在本地 `npm run deploy`，那里才有你的照片。
#
# 想给这个仓库配一个「推送就自动部署」的**演示站**（注意：不是正式站），
# 做法见 README「三、部署」里那一段。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 用大版本号（v7）而不是 v7.0.1：大版本标签会在同一个 major 里浮动，
      # 补丁和小版本自动跟上，不用手动改。破坏性变更会另开 major。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # 项目用的 Node，和 action 自己跑在哪个 Node 上是两回事
          cache: npm

      - run: npm ci

      # prebuild 钩子会在缺 src/data/photos.json 时自动铺一面占位墙，
      # 所以这里不需要任何照片或密钥
      - run: npm run build
